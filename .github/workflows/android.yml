name: android-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log

      - name: Show build log tail
        if: always()
        run: tail -n 150 build.log || true

      # 构建结果回写到 ci-log 分支，方便在任意机器上直接拉取完整日志
      - name: Upload build log to ci-log branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          mkdir -p /tmp/ci-log
          cd /tmp/ci-log
          git init -q
          git config user.name "df-box-ci"
          git config user.email "df-box-ci@users.noreply.github.com"
          {
            echo "run: ${GITHUB_RUN_NUMBER}"
            echo "commit: ${GITHUB_SHA}"
            echo "status: ${JOB_STATUS}"
            echo "time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "===== build.log (tail 800) ====="
            tail -n 800 "${GITHUB_WORKSPACE}/build.log" 2>/dev/null || echo "(no build.log)"
          } > build.log.txt
          git add build.log.txt
          git commit -qm "ci log #${GITHUB_RUN_NUMBER} (${JOB_STATUS})" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dfbox-annotator-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DF-Box 标注测试（latest）
          body: |
            自动构建 · commit ${{ github.sha }} · run #${{ github.run_number }}

            组件：yolo11n_dfv15（enemy / teammate），ONNX Runtime + TFLite 双后端，arm64-v8a。
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
